<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireless Headphones</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            /* Attractive background */
            background: linear-gradient(
                135deg,
                #e0e7ff,
                #f8fafc,
                #dbeafe
            );
        }

        /* Product Card */
        .product-card {
            width: 330px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.15);

            transition: 0.4s ease;
        }

        /* Card hover */
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.2);
        }

        /* Image container */
        .image-container {
            position: relative;
            height: 240px;
            overflow: hidden;
            background: #f1f5f9;
        }

        /* Product image */
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform 0.5s ease;
        }

        /* Image zoom */
        .product-card:hover .image-container img {
            transform: scale(1.08);
        }

        /* Badge */
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;

            padding: 7px 13px;
            border-radius: 20px;

            background: #111827;
            color: white;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Product details */
        .product-info {
            padding: 24px;
            text-align: center;
        }

        .product-name {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* Price */
        .price {
            font-size: 25px;
            font-weight: bold;
            color: #059669;
            margin-bottom: 20px;
        }

        .old-price {
            color: #9ca3af;
            font-size: 15px;
            text-decoration: line-through;
            margin-left: 8px;
        }

        /* Button */
        .cart-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.3);

            transition: all 0.3s ease;
        }

        /* Button hover */
        .cart-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.4);

            background: linear-gradient(
                135deg,
                #1d4ed8,
                #6d28d9
            );
        }

        /* Button click */
        .cart-button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="product-card">

        <!-- Product Image -->
        <div class="image-container">

            <span class="badge">BEST SELLER</span>

            <img
                src="https://m.media-amazon.com/images/I/71Hx8b6HGbL._AC_SX425_.jpg"
                alt="Wireless Headphones"
            >

        </div>

        <!-- Product Details -->
        <div class="product-info">

            <h2 class="product-name">
                Wireless Headphones
            </h2>

            <p class="description">
                Premium wireless headphones with powerful sound,
                comfortable ear cushions and long battery life.
            </p>

            <p class="price">
                ₹2,499
                <span class="old-price">₹3,499</span>
            </p>

            <button class="cart-button">
                🛒 Add to Cart
            </button>

        </div>

    </div>

</body>
</html>
